<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>嘉義縣平安家園多元關懷協會 BD03 交通接送管理系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 溫馨甜美色系 */
  --t:#D4608A;       /* 主色：玫瑰粉 */
  --tl:#FFF0F5;      /* 淡粉底 */
  --tm:#E8839F;      /* 中粉 */
  --td:#B34A72;      /* 深玫瑰 */
  --peach:#F5A27A;   /* 蜜桃橙 */
  --peach-l:#FEF1E8; /* 淡蜜桃 */
  --lavender:#C9A8E0;/* 薰衣草紫 */
  --lav-l:#F4EDFB;   /* 淡紫 */
  --mint:#7DCBB8;    /* 薄荷綠 */
  --mint-l:#E8F7F4;  /* 淡薄荷 */
  --border:#F5C6D8;  /* 粉邊框 */
  --bg:linear-gradient(135deg,#FFF5F8 0%,#FFF9F0 50%,#F5F0FF 100%);
  --card:#fff;
  --text:#4A3040;    /* 深莓紫 */
  --muted:#9B7A88;
  --muted2:#C4A8B4;
  --shadow:0 4px 20px rgba(212,96,138,.08);
  --shadow-h:0 8px 30px rgba(212,96,138,.15);
}
body{
  font-family:'Nunito','Noto Sans TC','Microsoft JhengHei',sans-serif;
  background:linear-gradient(135deg,#FFF5F8 0%,#FFF9F0 50%,#F5F0FF 100%);
  background-attachment:fixed;
  color:var(--text);font-size:14px;min-height:100vh;
}
/* ─── Header ─── */
.sys-header{
  background:linear-gradient(135deg,#D4608A 0%,#E8839F 50%,#C9A8E0 100%);
  color:#fff;padding:16px 28px;display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 20px rgba(212,96,138,.30);
  position:sticky;top:0;z-index:1000;overflow:hidden;
}
.sys-header::before{
  content:'🌸';position:absolute;right:160px;top:50%;transform:translateY(-50%);
  font-size:40px;opacity:.18;pointer-events:none;
}
.sys-header::after{
  content:'🌷';position:absolute;right:80px;top:50%;transform:translateY(-55%);
  font-size:32px;opacity:.18;pointer-events:none;
}
.sys-header h1{font-size:17px;font-weight:800;letter-spacing:.03em;text-shadow:0 1px 4px rgba(0,0,0,.15)}
.sys-header .sub{font-size:12px;opacity:.88;margin-top:3px;font-weight:500}
.badge-white{
  background:rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(4px);
}
/* ─── Nav ─── */
nav{
  background:#fff;
  border-bottom:2px solid var(--border);
  padding:10px 20px;display:flex;gap:8px;overflow-x:auto;
  box-shadow:0 2px 12px rgba(212,96,138,.07);
  align-items:center;
  position:sticky;top:var(--header-h,72px);z-index:999;
}
.nav-btn{
  padding:7px 18px;font-size:13px;font-weight:700;
  border:2px solid var(--border);
  background:#fff;
  cursor:pointer;
  border-radius:50px;
  color:var(--muted);white-space:nowrap;transition:all .2s;
  font-family:'Nunito',inherit;
}
.nav-btn.active{
  color:#fff;
  background:linear-gradient(135deg,var(--t),var(--tm));
  border-color:var(--t);
  box-shadow:0 3px 12px rgba(212,96,138,.30);
}
.nav-btn:hover:not(.active){color:var(--td);background:var(--tl);border-color:var(--tm)}
/* ─── Main ─── */
.main{padding:22px 24px;max-width:1100px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
/* ─── Card ─── */
.card{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:18px;
  padding:22px 24px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  transition:box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow-h)}
.card-title{
  font-size:12px;font-weight:800;color:var(--t);
  letter-spacing:.08em;margin-bottom:16px;padding-bottom:10px;
  border-bottom:2px dashed #F9D0E0;
  display:flex;align-items:center;gap:6px;
}
.card-title::before{content:'✿';font-size:14px;opacity:.7}
/* ─── Grids ─── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.grid1{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}
label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
/* ─── Inputs ─── */
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  padding:8px 12px;font-size:13px;
  border:1.5px solid #F2C4D4;
  border-radius:10px;
  background:#fff;color:var(--text);width:100%;
  font-family:'Nunito','Noto Sans TC',inherit;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--t);
  box-shadow:0 0 0 3px rgba(212,96,138,.12);
}
input[readonly],input.ro{
  background:#FFF8FB;color:var(--muted);
  cursor:default;border-color:#F5DDE6;
}
.info-box{
  background:#FFF8FB;border:1.5px solid #F2C4D4;
  border-radius:10px;padding:8px 12px;
  font-size:13px;min-height:36px;color:var(--text);
}
/* ─── Tags ─── */
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;font-weight:700}
.tag-f{background:#EDE9FF;color:#7C5CBF}
.tag-general{background:#F5EDF2;color:var(--muted);border:1px solid #F2C4D4}
.tag-low{background:var(--peach-l);color:#C06030}
.tag-teal{background:var(--mint-l);color:#3A8A78}
/* ─── Buttons ─── */
.btn{
  padding:9px 22px;font-size:13px;font-weight:700;
  border-radius:50px;cursor:pointer;transition:all .2s;
  border:2px solid transparent;
  font-family:'Nunito',inherit;letter-spacing:.02em;
}
.btn-p{
  background:linear-gradient(135deg,var(--t),var(--tm));
  color:#fff;border-color:var(--t);
  box-shadow:0 4px 14px rgba(212,96,138,.30);
}
.btn-p:hover{background:linear-gradient(135deg,var(--td),var(--t));transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,96,138,.35)}
.btn-o{background:#fff;color:var(--t);border-color:var(--t)}.btn-o:hover{background:var(--tl);transform:translateY(-1px)}
.btn-teal{background:#0F6E56;color:#fff;border-color:#0F6E56}
.btn-teal:hover{background:#085041;transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,110,86,.3)}
.btn-amber{
  background:#fff;color:var(--peach);border-color:var(--peach);
}.btn-amber:hover{background:var(--peach-l);transform:translateY(-1px)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
/* ─── Alerts ─── */
.alert{border-radius:12px;padding:11px 16px;font-size:13px;margin-top:10px;display:none;font-weight:600}
.alert.show{display:block}
.alert-s{background:#E8F7F4;color:#2D7A6A;border:1px solid #A8DECE}
.alert-e{background:#FCEEF0;color:#C0334A;border:1px solid #F5C0C8}
/* ─── Table ─── */
.tbl-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:600px}
th{
  background:linear-gradient(135deg,#FAE0EB,#F9E8F5);
  font-weight:700;font-size:11px;color:var(--td);
  padding:9px 10px;
  border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);
  border-right:1px solid #F5C6D8;
  text-align:center;white-space:nowrap;
}
th:first-child{border-left:1.5px solid var(--border);border-radius:10px 0 0 0}
th:last-child{border-radius:0 10px 0 0}
td{padding:7px 8px;border-bottom:1px solid #FAE8F0;border-right:1px solid #FAE8F0;text-align:center;vertical-align:middle;color:var(--text)}
td:first-child{border-left:1.5px solid var(--border)}
tr:last-child td:first-child{border-radius:0 0 0 10px}
tr:last-child td:last-child{border-radius:0 0 10px 0}
td input[type=text],td input[type=time],td input[type=number]{padding:3px 6px;font-size:12px;min-width:55px;border-radius:8px;border:1px solid #F2C4D4}
td input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--t)}
tr:hover td{background:#FFF5F8}
.tr-go{background:#F0FBF8}.tr-ret{background:#FFF7F0}
.tr-sum{background:#FFF0F5;font-weight:700}
/* ─── Booking list ─── */
.bk-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 16px;
  background:linear-gradient(135deg,#FFF8FB,#FFF5F0);
  border-radius:12px;border:1.5px solid var(--border);
  margin-bottom:10px;flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(212,96,138,.06);
  transition:box-shadow .2s;
}
.bk-item:hover{box-shadow:0 4px 14px rgba(212,96,138,.12)}
.bk-name{font-weight:800;min-width:70px;color:var(--td)}
.bk-date{color:var(--muted);font-size:12px;min-width:120px;font-weight:600}
.bk-addr{color:var(--muted);font-size:12px;flex:1}
.bk-del{
  background:none;border:1.5px solid #F2C4D4;
  border-radius:20px;padding:3px 12px;font-size:11px;
  color:var(--muted);cursor:pointer;font-weight:600;transition:all .15s;
}
.bk-del:hover{background:#FCEEF0;color:#C0334A;border-color:#F5A0B0}
/* ─── Month picker ─── */
.month-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
/* ─── Sign pad ─── */
.sign-area{
  border:2px dashed #F2C4D4;border-radius:12px;
  cursor:crosshair;background:#FFF8FB;touch-action:none;display:block;
}
.sign-btns{display:flex;gap:8px;margin-top:6px}
.sign-clr{
  font-size:11px;padding:4px 12px;border-radius:20px;cursor:pointer;
  background:#fff;border:1.5px solid var(--border);
  color:var(--muted);font-weight:600;transition:all .15s;
}
.sign-clr:hover{background:var(--tl);color:var(--t)}
/* ─── Stats bar ─── */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.stat-card{
  background:linear-gradient(135deg,#FFF0F5,#FFF8F0);
  border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;
  box-shadow:0 2px 8px rgba(212,96,138,.07);
}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:800;color:var(--t)}
/* ─── Dispatch accordion ─── */
.dp-user-tab{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  background:linear-gradient(135deg,#FFF5F8,#FFF9F0);
  border:1.5px solid var(--border);
  border-radius:12px;cursor:pointer;margin-bottom:6px;
  transition:all .2s;user-select:none;
  box-shadow:0 2px 8px rgba(212,96,138,.06);
}
.dp-user-tab:hover{background:var(--tl);border-color:var(--tm);box-shadow:0 4px 14px rgba(212,96,138,.12)}
.dp-user-tab.open{background:var(--tl);border-color:var(--t);box-shadow:0 4px 14px rgba(212,96,138,.14)}
.dp-user-tab .tab-name{font-weight:800;font-size:14px;min-width:80px;color:var(--td)}
.dp-user-tab .tab-arrow{margin-left:auto;font-size:13px;color:var(--t);transition:transform .25s}
.dp-user-tab.open .tab-arrow{transform:rotate(90deg)}
.dp-user-body{display:none;margin-bottom:12px}
.dp-user-body.open{display:block}
/* ─── Print ─── */
/* Photo capture */
.photo-area{background:#FFF8FB;border:2px dashed #F2C4D4;border-radius:12px;padding:14px}
.photo-preview img{border:2px solid var(--border);box-shadow:var(--shadow)}
@media print{nav,.sys-header,.btn-row,.btn,.bk-del{display:none!important}body{background:#fff}.card{border:none;padding:0;box-shadow:none}.main{padding:0}}
@media(max-width:640px){
  /* ── Header ── */
  .sys-header{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .sys-header::before,.sys-header::after{display:none}
  .sys-header h1{font-size:14px;letter-spacing:.01em}
  .sys-header .sub{font-size:11px}
  .sys-header>div:last-child{margin-left:0;width:100%;display:flex;gap:6px;flex-wrap:wrap}
  .badge-white{font-size:11px;padding:3px 9px}

  /* ── Nav ── */
  nav{padding:8px 10px;gap:5px;-webkit-overflow-scrolling:touch}
  .nav-btn{padding:6px 12px;font-size:12px}

  /* ── Main ── */
  .main{padding:10px}

  /* ── Cards ── */
  .card{padding:14px 14px;border-radius:14px;margin-bottom:12px}
  .card-title{font-size:11px;margin-bottom:12px;padding-bottom:8px}

  /* ── Grids ── */
  .grid2,.grid3,.grid4{grid-template-columns:1fr;gap:10px}

  /* ── Inputs & Labels ── */
  label{font-size:10px}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    padding:9px 11px;font-size:14px;border-radius:9px
  }

  /* ── Buttons ── */
  .btn{padding:9px 16px;font-size:12px}
  .btn-row{gap:7px;justify-content:stretch}
  .btn-row .btn{flex:1;text-align:center;justify-content:center}

  /* ── Tags ── */
  .tag{font-size:10px;padding:2px 8px}

  /* ── Booking list ── */
  .bk-item{padding:10px 12px;gap:7px}
  .bk-name{font-size:13px;min-width:56px}
  .bk-date{font-size:11px;min-width:90px}
  .bk-addr{font-size:11px}
  .bk-del{font-size:10px;padding:3px 10px}

  /* ── Stats ── */
  .stats-bar{grid-template-columns:1fr 1fr;gap:8px}
  .stat-val{font-size:20px}

  /* ── Dispatch accordion ── */
  .dp-user-tab{padding:9px 12px;gap:7px}
  .dp-user-tab .tab-name{font-size:13px;min-width:60px}

  /* ── Tables: allow horizontal scroll, tighten cells ── */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
  table{font-size:11px}
  th{font-size:10px;padding:7px 6px}
  td{padding:6px 5px}
  td input[type=text],td input[type=time],td input[type=number]{font-size:11px;padding:2px 4px;min-width:48px}

  /* ── Daily report modal ── */
  #daily-report-inner{border-radius:10px}
  #daily-report-inner>div:first-child{padding:12px 14px}
  #daily-report-inner>div:first-child>div{font-size:14px}

  /* ── Photo area ── */
  .photo-area{padding:10px}
}
</style>
</head>

<!-- ===== 模組一：預約 ===== -->
<div id="panel-booking" class="panel active">
  <div class="card">
    <div class="card-title">固定資訊</div>
    <div class="grid4">
      <div class="field"><label>服務類別</label><input type="text" value="DB03" readonly class="ro"></div>
      <div class="field"><label>駕駛員</label><input type="text" value="林智仁" readonly class="ro"></div>
      <div class="field"><label>車號</label><input type="text" value="BEW-0903" readonly class="ro"></div>
      <div class="field"><label>統編</label><input type="text" value="92488801" readonly class="ro"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">預約資料</div>
    <div class="grid2">
      <div class="field"><label>服務日期</label><input type="date" id="bk-date" onchange="autoWeekday()"></div>
      <div class="field"><label>星期</label><input type="text" id="bk-wd" readonly class="ro" placeholder="自動帶入"></div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>使用者</label>
        <select id="bk-user" onchange="fillUser()">
          <option value="">— 請選擇 —</option>
        </select>
      </div>
      <div class="field"><label>電話</label><div class="info-box" id="disp-phone">—</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>性別</label><div class="info-box" id="disp-gender">—</div></div>
      <div class="field">
        <label>身分別</label>
        <select id="bk-welfare">
          <option value="一般戶">一般戶</option>
          <option value="中低收入">中低收入</option>
        </select>
      </div>
    </div>
    <div class="grid1">
      <div class="field"><label>案家地址</label><div class="info-box" id="disp-addr">—</div></div>
    </div>
    <div class="grid1">
      <div class="field"><label>目的地址</label><input type="text" id="bk-dest" value="布袋鎮平安診所岑海里 C 據點"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">接送安排</div>
    <div class="grid4">
      <div class="field"><label>啟程時間（去程）</label><input type="time" id="bk-dep"></div>
      <div class="field"><label>回程時間</label><input type="time" id="bk-ret"></div>
      <div class="field">
        <label>陪同人員</label>
        <select id="bk-companion">
          <option value="無">無（不陪同）</option>
          <option value="有">有（陪同）</option>
        </select>
      </div>
      <div class="field"><label>備註</label><input type="text" id="bk-note" placeholder="特殊需求..."></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-o" onclick="clearBooking()">清除</button>
    <button class="btn btn-p" onclick="saveBooking()">儲存預約</button>

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwOc2RNfrCgWK_pqfPKeyrnaaVlEjOCZDSZukj6rWgK5_lIo6N1KiIYoEXfsSNbfrFNyw/exec';

// ── 同步狀態指示 ────────────────────────────────────────
function showSync(msg, color='#7DCBB8'){
  let el=document.getElementById('sync-indicator');
  if(!el){
    el=document.createElement('div');
    el.id='sync-indicator';
    el.style.cssText='position:fixed;bottom:16px;right:16px;z-index:9999;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.15);transition:opacity .5s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.style.background=color;el.style.color='#fff';el.style.opacity='1';
  el.textContent=msg;
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.opacity='0',2500);
}

// ── GAS 呼叫 ────────────────────────────────────────────
async function gasGet(action){
  if(!GAS_URL){console.warn('尚未設定 GAS_URL');return null;}
  const res=await fetch(`${GAS_URL}?action=${action}`);
  return res.json();
}
async function gasPost(action, data){
  if(!GAS_URL){console.warn('尚未設定 GAS_URL');return null;}
  const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action,data})});
  return res.json();
}

async function loadBookings(){
  showSync('⟳ 載入預約紀錄…','#C9A8E0');
  try{
    const r=await gasGet('getBookings');
    if(r&&r.ok){
      if(r.data.length){
        bookings=r.data.map(b=>({
          ...b,
          id:String(b.id),
          date: b.date ? String(b.date).split('T')[0] : b.date,
          wd: b.wd || (b.date ? '星期'+WD[new Date(String(b.date).split('T')[0]+'T00:00:00').getDay()] : '')
        }));
        localStorage.setItem('pg_bookings',JSON.stringify(bookings));
        showSync('✓ 預約紀錄已同步');
      } else {
        const cached=JSON.parse(localStorage.getItem('pg_bookings')||'[]');
        if(cached.length){
          bookings=cached.map(b=>({
            ...b,
            date: b.date ? String(b.date).split('T')[0] : b.date,
            wd: b.wd || (b.date ? '星期'+WD[new Date(String(b.date).split('T')[0]+'T00:00:00').getDay()] : '')
          }));
          await gasPost('saveBookings',bookings);
          showSync('✓ 本機資料已上傳至試算表');

          bookings=[];

function saveUser(){
  const name=document.getElementById('usr-name').value.trim();
  const err=document.getElementById('usr-err');
  if(!name){err.textContent='⚠ 請填寫姓名。';err.classList.add('show');return;}
  if(!document.getElementById('usr-addr').value.trim()){err.textContent='⚠ 請填寫個案地址。';err.classList.add('show');return;}
  err.classList.remove('show');
  const editOrig=document.getElementById('usr-name').getAttribute('data-edit');
  if(editOrig && editOrig!==name) delete USERS[editOrig];
  USERS[name]={
    phone:document.getElementById('usr-phone').value.trim(),
    gender:document.getElementById('usr-gender').value,
    addr:document.getElementById('usr-addr').value.trim(),
    dest:document.getElementById('usr-dest').value.trim(),
    welfare:document.getElementById('usr-welfare').value,
    companion:document.getElementById('usr-companion').value,
    memo:document.getElementById('usr-memo').value.trim()
  };

  renderUserTable();
  refreshUserSelect();
  clearUserForm();
  document.getElementById('usr-alert').classList.add('show');
  setTimeout(()=>document.getElementById('usr-alert').classList.remove('show'),3000);
}

  const u=USERS[name];

  document.getElementById('usr-phone').value=u.phone||'';
  document.getElementById('usr-addr').value=u.addr||'';

  document.getElementById('usr-memo').value=u.memo||'';
  window.scrollTo({top:0,behavior:'smooth'});

const camStreams={};
function initSign(i){} // replaced by camera
function clrSign(i){}  // replaced by camera

async function startCam(i){
  document.getElementById('photo-idle-'+i).style.display='none';
  document.getElementById('photo-preview-'+i).style.display='none';
  const camWrap=document.getElementById('photo-cam-'+i);
  camWrap.style.display='block';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    camStreams[i]=stream;
    document.getElementById('video-'+i).srcObject=stream;
  }catch(e){
    camWrap.style.display='none';
    document.getElementById('photo-idle-'+i).style.display='block';
    alert('無法開啟相機：'+e.message);
  }
}
function stopCam(i){
  if(camStreams[i])camStreams[i].getTracks().forEach(t=>t.stop());
  delete camStreams[i];
  document.getElementById('photo-cam-'+i).style.display='none';
  const hasPhoto=document.getElementById('photo-img-'+i).src&&document.getElementById('photo-img-'+i).src!==location.href;
  document.getElementById(hasPhoto?'photo-preview-'+i:'photo-idle-'+i).style.display='block';
}
function snapPhoto(i){
  const video=document.getElementById('video-'+i);
  const canvas=document.getElementById('photo-canvas-'+i);
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  const dataUrl=canvas.toDataURL('image/jpeg',0.85);
  document.getElementById('photo-img-'+i).src=dataUrl;
  const now=new Date();
  document.getElementById('photo-time-'+i).textContent=
    `拍攝時間：${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  stopCam(i);
  document.getElementById('photo-cam-'+i).style.display='none';
  document.getElementById('photo-idle-'+i).style.display='none';
  document.getElementById('photo-preview-'+i).style.display='block';
}
function retakePhoto(i){
  document.getElementById('photo-preview-'+i).style.display='none';
  startCam(i);
}

function filterByMonth(y,m){
  return bookings.filter(b=>{
    const d=new Date(b.date);
    return(d.getFullYear()-1911)===parseInt(y)&&(d.getMonth()+1)===parseInt(m);
  });
}
function uniqueDates(items){return[...new Set(items.map(b=>b.date))].sort()}
function rocFmt(dateStr,showWd=true){
  const d=new Date(dateStr);
  const r=`${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()}`;
  return showWd?`${r}（${WD[d.getDay()]}）`:r;
}

function fmtTime(t){
  if(!t)return'';
  const [hh,mm]=t.split(':');
  const h=parseInt(hh);
  const ampm=h<12?'上午':'下午';
  const h12=h%12||12;
  return`${ampm} ${String(h12).padStart(2,'0')}:${mm}`;
}

let vitalsData={};
async function loadVitals(){
  try{
    const r=await gasGet('getVitals');
    if(r&&r.ok){vitalsData=r.data;localStorage.setItem('pg_vitals',JSON.stringify(vitalsData));}
  }catch(e){vitalsData=JSON.parse(localStorage.getItem('pg_vitals')||'{}');}
}
async function saveVital(date,field,val){
  const k='pg_vital_'+date+'_'+field;
  vitalsData[k]=val;
  localStorage.setItem('pg_vitals',JSON.stringify(vitalsData));
  try{await gasPost('saveVitals',vitalsData);showSync('✓ 已同步');}
  catch(e){showSync('⚠ 暫存本機','#F5A27A');}
}
function getVital(date,field){
  return vitalsData['pg_vital_'+date+'_'+field]||'';
}

function getDaysInMonth(y_roc,m){
  const y_ad=parseInt(y_roc)+1911;
  return new Date(y_ad,m,0).getDate();
}

function rocFmtV(dateStr){
  const d=new Date(dateStr);
  const roc=d.getFullYear()-1911;
  return `${roc}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function bpClass(bp){
  if(!bp)return '';
  const parts=bp.split('/');
  if(parts.length<2)return '';
  const s=parseInt(parts[0]),d=parseInt(parts[1]);
  if(isNaN(s)||isNaN(d))return '';
  if(s>=140||d>=90)return 'color:#C0334A;font-weight:700';
  if(s>=130||d>=80)return 'color:#C06030;font-weight:600';
  return 'color:#2D7A6A';
}
function tempClass(t){
  if(!t)return '';
  const v=parseFloat(t);
  if(isNaN(v))return '';
  if(v>=37.5)return 'color:#C0334A;font-weight:700';
  if(v>=37.0)return 'color:#C06030;font-weight:600';
  return 'color:#2D7A6A';
}
function hrClass(hr){
  if(!hr)return '';
  const v=parseInt(hr);
  if(isNaN(v))return '';
  if(v>100||v<60)return 'color:#C0334A;font-weight:700';
  return 'color:#2D7A6A';
}

function genVitals(){
  const y=document.getElementById('vt-y').value;
  const m=document.getElementById('vt-m').value;

  const days=new Date(y_ad,m,0).getDate();

  const dates=[];
  for(let d=1;d<=days;d++){
    const dt=`${y_ad}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    dates.push(dt);
  }

  let rows='';

    const date_obj=new Date(dt);
    const wd='星期'+WD[date_obj.getDay()];
    const roc_str=rocFmtV(dt);
    const temp=getVital(dt,'temp');

    const hr=getVital(dt,'hr');

    rows+=`<tr${isEmpty?' style="opacity:0.45"':''}>
      <td style="font-size:11px">${roc_str}</td>

      <td id="vt-remark-${dt}" style="font-size:11px">${getVitalRemark(temp,bp,hr)}</td>
    </tr>`;
  });

  // Stats
  const recorded=dates.filter(dt=>getVital(dt,'temp')||getVital(dt,'bp')||getVital(dt,'hr'));
  const abnormal=dates.filter(dt=>{
    const t=getVital(dt,'temp'),b=getVital(dt,'bp'),h=getVital(dt,'hr');
    return tempClass(t).includes('C0334A')||bpClass(b).includes('C0334A')||hrClass(h).includes('C0334A');
  });

  out.innerHTML=`<div class="stats-bar" style="margin-top:12px">

    <div class="stat-card"><div class="stat-lbl">已記錄天數</div><div class="stat-val" style="color:var(--mint)">${recorded.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">異常紀錄</div><div class="stat-val" style="color:${abnormal.length>0?'#C0334A':'var(--mint)'}">${abnormal.length}</div></div>
  </div>
  <div class="card">
    <div class="card-title">駕駛員生命徵象月報 — 民國 ${y} 年 ${m} 月 ｜ 駕駛員：林智仁</div>
    <div style="margin-bottom:8px"><span style="font-size:11px;color:var(--t)">✿ 直接在欄位輸入數值，自動儲存 ｜
      <span style="color:#2D7A6A">●</span> 正常 
      <span style="color:#C06030">●</span> 偏高注意 
      <span style="color:#C0334A">●</span> 異常警示</span></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>日期（民國）</th><th>星期</th>
          <th>體溫（°C）</th>
          <th>血壓（mmHg）</th>
          <th>心跳（次/分）</th>
          <th>備註</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="margin-top:12px;font-size:11px;color:var(--muted)">
      ※ 體溫≥37.5°C / 血壓≥140/90 / 心跳&lt;60或&gt;100 時標紅警示
    </div>
  </div>`;
}

function getVitalRemark(temp,bp,hr){
  const remarks=[];
  if(tempClass(temp).includes('C0334A'))remarks.push('體溫異常');
  else if(tempClass(temp).includes('C06030'))remarks.push('體溫偏高');
  if(bpClass(bp).includes('C0334A'))remarks.push('血壓異常');
  else if(bpClass(bp).includes('C06030'))remarks.push('血壓偏高');
  if(hrClass(hr).includes('C0334A'))remarks.push('心跳異常');
  return remarks.length?`<span style="color:#C0334A;font-size:11px">⚠ ${remarks.join('、')}</span>`:'<span style="color:#7DCBB8;font-size:11px">正常</span>';
}

    const hStyle=hrClass(hr).includes('C0334A')?warnStyle:normalStyle;
    if(tStyle===warnStyle)remarks.push('體溫異常');else if(tStyle===cautionStyle)remarks.push('體溫偏高');
    if(bStyle===warnStyle)remarks.push('血壓異常');else if(bStyle===cautionStyle)remarks.push('血壓偏高');
    if(hStyle===warnStyle)remarks.push('心跳異常');
    const remark=remarks.join('、')||'正常';
    const cells=[roc_str,wd,temp||'—',bp||'—',hr||'—',remark];
    const styles=[normalStyle,normalStyle,tStyle,bStyle,hStyle,remarks.length?warnStyle:normalStyle];
    cells.forEach((v,ci)=>{ws[XLSX.utils.encode_cell({r:row,c:ci})]={v:String(v),t:'s',s:styles[ci]};});
    row++;
  }
  ws['!ref']=`A1:F${row}`;
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:5}},{s:{r:1,c:0},e:{r:1,c:5}},{s:{r:2,c:0},e:{r:2,c:5}}];
  ws['!cols']=[{wch:16},{wch:8},{wch:12},{wch:14},{wch:12},{wch:20}];
  ws['!rows']=[{hpt:22},{hpt:18},{hpt:16}];
  XLSX.utils.book_append_sheet(wb,ws,'生命徵象月報');
  XLSX.writeFile(wb,`平安家園_BD03_生命徵象月報_${y}年${m}月.xlsx`);
}

/* ===== 日別報表 ===== */
function toMinutes(t){
  if(!t)return null;
  const [h,m]=t.split(':').map(Number);
  return h*60+m;
}

function checkTimeConflicts(items){
  /* 回傳每筆 booking 的衝突警告（array of {id, msg}） */
  const warnings=[];
  const segs=[];
  items.forEach((b,i)=>{
    const gd=toMinutes(b.gdep),ga=toMinutes(b.garr);
    const rd=toMinutes(b.rdep),ra=toMinutes(b.rarr);
    if(gd!==null&&ga!==null) segs.push({i,label:`${b.user} 去程`,s:gd,e:ga});
    if(rd!==null&&ra!==null) segs.push({i,label:`${b.user} 回程`,s:rd,e:ra});
  });
  for(let a=0;a<segs.length;a++){
    for(let b=a+1;b<segs.length;b++){
      const A=segs[a],B=segs[b];
      if(A.e>B.s&&B.e>A.s){
        warnings.push({
          label:`⚠️ 時間衝突：【${A.label}】與【${B.label}】時段重疊`,
          seg1:A,seg2:B
        });
      }
      if(A.e>B.s&&A.s<B.s){
        /* no duplicate — already caught above */
      }
    }
  }
  /* 另外檢查去程抵達 > 回程出發（順序倒置） */
  items.forEach((b,i)=>{
    const ga=toMinutes(b.garr),rd=toMinutes(b.rdep);
    if(ga!==null&&rd!==null&&rd<ga){
      warnings.push({label:`⚠️ 順序異常：【${b.user}】回程出發（${b.rdep}）早於去程抵達（${b.garr}）`});
    }
  });
  return warnings;
}
